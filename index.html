<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>Walka Czarodziejów</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="loginScreen" class="screen">
    <h1>Walka Czarodziejów</h1>

    <label>Nick:
      <input id="nickInput" maxlength="16">
    </label>

    <label>Hasło:
      <input id="passwordInput" type="password" maxlength="32">
    </label>

    <div class="device-row">
      <button data-device="desktop" class="device-button">Laptop</button>
      <button data-device="mobile" class="device-button">Telefon</button>
    </div>

    <button id="loginButton">Zaloguj się</button>
    <p id="loginError" class="error"></p>
  </div>

  <div id="gameScreen" class="screen hidden">
    <canvas id="gameCanvas"></canvas>

    <div class="hud">
      <div class="player-panel">
        <span id="p1Name"></span>
        <span id="p1HpLabel"></span>
        <span id="p1AmmoLabel"></span>
      </div>

      <div class="player-panel">
        <span id="p2Name"></span>
        <span id="p2HpLabel"></span>
        <span id="p2AmmoLabel"></span>
      </div>

      <div id="statusText"></div>
    </div>

    <div id="profileBadge" class="profile-badge">PROFIL</div>
  </div>

  <div id="profileModal" class="modal hidden">
    <div class="modal-window">
      <h2>Profil</h2>
      <button id="leaderboardButton">Topki</button>
      <button id="logoutButton">Wyloguj się</button>
      <button id="closeProfile">Zamknij</button>
    </div>
  </div>

  <div id="leaderboardModal" class="modal hidden">
    <div class="modal-window">
      <h2>Topki</h2>
      <ol id="leaderboardList"></ol>
      <button id="closeLeaderboard">Zamknij</button>
    </div>
  </div>

  <script src="client.js"></script>
</body>
</html>
